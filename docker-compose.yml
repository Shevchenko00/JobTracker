services:

  jobs_backend:
    build: ./backend
    container_name: jobs_backend
    restart: unless-stopped

    ports:
      - "9212:9212"

    volumes:
      - ./backend:/usr/src/app
      - ./media:/usr/src/app/media

    environment:
      POSTGRES_HOST: jobs_postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: jobs
      POSTGRES_USER: jobs
      POSTGRES_PASSWORD: jobs_password

    depends_on:
      jobs_postgres:
        condition: service_healthy

    networks:
      - jobs_network

    command: >
      bash -c "python manage.py migrate &&
               python manage.py runserver 0.0.0.0:9212"


  jobs_frontend:
    build: ./fe
    container_name: jobs_frontend
    restart: unless-stopped

    ports:
      - "5172:5172"

    volumes:
      - ./fe:/usr/src/app
      - /usr/src/app/node_modules

    extra_hosts:
      - "host.docker.internal:host-gateway"

    depends_on:
      - jobs_backend

    networks:
      - jobs_network


  jobs_postgres:
    image: postgres:17
    container_name: jobs_postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: jobs
      POSTGRES_USER: jobs
      POSTGRES_PASSWORD: jobs_password

    volumes:
      - jobs_postgres_data:/var/lib/postgresql/data
      - ./backups:/backups
      - ./backend/init-restore.sh:/docker-entrypoint-initdb.d/init-restore.sh

    ports:
      - "5433:5432"

    networks:
      - jobs_network

    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U jobs -d jobs" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s


  jobs_backup:
    image: postgres:17
    container_name: jobs_backup
    restart: unless-stopped

    environment:
      PGPASSWORD: jobs_password

    entrypoint: >
      sh -c "
        mkdir -p /backups &&
        while true; do
          echo \"[backup] $$(date): starting dump\";
          pg_dump -h jobs_postgres -U jobs -d jobs > /backups/jobs_$$(date +%Y%m%d_%H%M%S).sql &&
          echo \"[backup] $$(date): dump done\" ||
          echo \"[backup] $$(date): dump FAILED\";
          find /backups -name 'jobs_*.sql' -mtime +7 -delete;
          sleep 86400;
        done
      "

    volumes:
      - ./backups:/backups

    networks:
      - jobs_network

    depends_on:
      jobs_postgres:
        condition: service_healthy


networks:
  jobs_network:
    external: true


volumes:
  jobs_postgres_data:
    external: true